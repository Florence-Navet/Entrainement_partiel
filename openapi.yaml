openapi: 3.0.3
info:
  title: API d'entraînement - Partiel
  version: 1.0.0
paths:
  /ping:
    get:
      summary: Vérifier que l'API répond
      responses:
        "200":
          description: L'API répond pong
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong
  /users:
    post:
      summary: Créer un compte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: testeur@partiel.com
                password:
                  type: string
                  example: password123
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  email:
                    type: string
                    example: testeur@partiel.com
        "400":
          description: Données invalides
  /login:
    post:
      summary: Se connecter à l'API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: password123
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: connected
        "401":
          description: Identifiants invalides
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid credentials
        "429":
          description: Trop de tentatives de connexion
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Too many login attempts
  /me:
    get:
      summary: Voir l'utilisateur connecté
      security:
        - bearerAuth: []
      responses:
        "200":
          description: L'utilisateur lu dans le jeton
        "401":
          description: Jeton absent ou invalide

  /challenges:
    post:
      summary: Créer un nouveau défi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Faire une randonnée
                category:
                  type: string
                  example: carbone
                points:
                  type: number
                  example: 30
      responses:
        "201":
          description: Défi créé
        "400":
          description: Données invalides
  /challenges/{id}/complete:
    post:
      summary: Valider un défi pour aujourd'hui
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer    
      responses:
        "201":
          description: Défi validé, points ajoutés
        "400":
          description: Id invalide
        "401":
          description: Jeton absent ou invalide
        "404":
          description: Défi introuvable
        "409":
          description: Défi déjà validé aujourd'hui
  /challenges/{id}:
    delete:
      summary: supprimer un defi
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "404":
          description: Challenge not found
        "204":
          description: Defi supprime
        "400":
          description: Id invalide
        "401":
          description: Jeton absent ou invalide
    patch:
      summary: modifier les points d'un defi
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                points:
                  type: number
                  example: 30
      responses:
        "200":
          description: Défi modifié
        "400": 
          description: Id ou points invalides
        "401":
          description: Jeton absent ou invalide
        "404":
          description: Défi introuvable
  /me/points:
    get:
      summary: Voir mon total de points
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Le total de points de l'utilisatrice connectée
        "401":
          description: Jeton absent ou invalide

  /me/rank:
    get:
      summary: Voir mon rang
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Le rang de l'utilisateur connecté
        "401":
          description: Jeton absent ou invalide
        "404":
          description: L'utilisatrice n'a encore validé aucun défi
  /leaderboard:
    get:
      summary: Voir le classement des meilleures utilisatrices
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 3
      responses:
        "200":
          description: Les utilisatrices avec le plus de points, de la première à la dernière
        "400":
          description: limit doit être un entier entre 1 et 10


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

 