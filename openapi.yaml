openapi: 3.0.3
info:
  title: API d'entraînement - Partiel
  version: 1.0.0
paths:
  /ping:
    get:
      summary: Vérifier que l'API répond
      responses:
        "200":
          description: L'API répond pong
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong
  /users:
    post:
      summary: Créer un compte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: testeur@partiel.com
                password:
                  type: string
                  example: password123
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  email:
                    type: string
                    example: testeur@partiel.com
        "400":
          description: Données invalides
  /login:
    post:
      summary: Se connecter à l'API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: password123
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: connected
        "401":
          description: Identifiants invalides
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid credentials
        "429":
          description: Trop de tentatives de connexion
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Too many login attempts
  /me:
    get:
      summary: Voir l'utilisateur connecté
      security:
        - bearerAuth: []
      responses:
        "200":
          description: L'utilisateur lu dans le jeton
        "401":
          description: Jeton absent ou invalide
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer